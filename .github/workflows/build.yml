name: Build DashEyes Windows Executable

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-build.txt

    - name: Install Dependencies
      run: |
        python -m pip install -r requirements-build.txt
        python -m pip check

    - name: Unit and UI tests (no camera required)
      env:
        QT_QPA_PLATFORM: offscreen
      run: python -m unittest discover -s tests -v

    - name: Native dependency preflight before packaging (no camera)
      run: python main.py --diagnose --no-camera

    - name: Build Executable with PyInstaller
      env:
        DASHEYES_BUILD_CONSOLE_PROBE: '1'
      run: |
        python -m PyInstaller --noconfirm pyinstaller.spec

    - name: Record packaged native library inventory
      run: |
        $root = (Resolve-Path '.\dist\DashEyes').Path
        Get-ChildItem -Path $root -Recurse -File |
          Where-Object { $_.Extension -in @('.dll', '.pyd') } |
          ForEach-Object { $_.FullName.Substring($root.Length + 1) } |
          Sort-Object |
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'dasheyes-native-libraries.log')

    - name: Packaged dispatch smoke test (no webcam)
      run: |
        $cases = @(
          @{ Name = 'windowed-default'; Exe = 'DashEyes.exe'; NativeFirst = $false },
          @{ Name = 'console-default'; Exe = 'DashEyes-Diagnostic.exe'; NativeFirst = $false },
          @{ Name = 'windowed-native-first'; Exe = 'DashEyes.exe'; NativeFirst = $true },
          @{ Name = 'console-native-first'; Exe = 'DashEyes-Diagnostic.exe'; NativeFirst = $true }
        )
        $results = @()
        foreach ($case in $cases) {
          $stdout = Join-Path $env:RUNNER_TEMP "dasheyes-diagnose-$($case.Name)-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "dasheyes-diagnose-$($case.Name)-stderr.log"
          $arguments = @('--diagnose', '--no-camera')
          if ($case.NativeFirst) { $arguments += '--native-first' }
          $exitCode = $null
          $report = $null
          $problem = ''
          try {
            $path = Join-Path '.\dist\DashEyes' $case.Exe
            $p = Start-Process -FilePath $path -ArgumentList $arguments -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $handle = $p.Handle
            if (-not $p.WaitForExit(20000)) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              $p.WaitForExit(5000) | Out-Null
              $problem = 'timeout'
            } else {
              $p.Refresh()
              $exitCode = $p.ExitCode
            }
          } catch {
            $problem = $_.Exception.Message
          }
          Write-Host "Case: $($case.Name), exit code: [$exitCode], problem: $problem"
          foreach ($file in @($stdout, $stderr)) {
            if (Test-Path $file) { Get-Content -Path $file }
          }
          if (Test-Path $stdout) {
            foreach ($line in Get-Content -Path $stdout) {
              try {
                $candidate = $line | ConvertFrom-Json -ErrorAction Stop
                if ($candidate.type -eq 'DIAGNOSTICS') { $report = $candidate }
              } catch { }
            }
          }
          $ok = $null -ne $exitCode -and $exitCode -eq 0 -and $null -ne $report -and $report.packages_ok -eq $true
          $results += [pscustomobject]@{ case = $case.Name; passed = $ok; exit_code = $exitCode; problem = $problem }
        }
        $results | Format-Table -AutoSize
        $results | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'dasheyes-comparison.json')
        # Las comparaciones no sustituyen ni relajan la validación de la app real.
        if (-not $results[0].passed) { throw 'Production executable still fails; see four-case comparison and diagnostic artifact' }
        if (@($results | Where-Object { -not $_.passed }).Count -gt 0) {
          throw 'At least one controlled native-import comparison failed; inspect the comparison artifact'
        }

    - name: Preserve diagnostics even when packaging validation fails
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: DashEyes-build-diagnostics
        if-no-files-found: warn
        include-hidden-files: true
        path: |
          ${{ runner.temp }}/dasheyes-diagnose-*.log
          ${{ runner.temp }}/dasheyes-native-libraries.log
          ${{ runner.temp }}/dasheyes-comparison.json
          build/**/warn-*.txt
          dist/DashEyes/.dasheyes/logs/*.log
          dist/DashEyes/_internal/.dasheyes/logs/*.log

    - name: Upload Windows Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DashEyes-Windows-x64
        path: |
          dist/DashEyes/
          !dist/DashEyes/DashEyes-Diagnostic.exe
        retention-days: 14
