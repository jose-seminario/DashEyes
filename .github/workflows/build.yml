name: Build DashEyes Windows Executable

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-build.txt

    - name: Install Dependencies
      run: |
        python -m pip install -r requirements-build.txt
        python -m pip check

    - name: Unit and UI tests (no camera required)
      env:
        QT_QPA_PLATFORM: offscreen
      run: python -m unittest discover -s tests -v

    - name: Native dependency preflight before packaging (no camera)
      run: python main.py --diagnose --no-camera

    - name: Build Executable with PyInstaller
      run: |
        python -m PyInstaller --noconfirm pyinstaller.spec

    - name: Record packaged native library inventory
      run: |
        $root = (Resolve-Path '.\dist\DashEyes').Path
        Get-ChildItem -Path $root -Recurse -File |
          Where-Object { $_.Extension -in @('.dll', '.pyd') } |
          ForEach-Object { $_.FullName.Substring($root.Length + 1) } |
          Sort-Object |
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'dasheyes-native-libraries.log')

    - name: Packaged dispatch smoke test (no webcam)
      run: |
        $stdout = Join-Path $env:RUNNER_TEMP 'dasheyes-diagnose-stdout.log'
        $stderr = Join-Path $env:RUNNER_TEMP 'dasheyes-diagnose-stderr.log'
        $p = Start-Process -FilePath '.\dist\DashEyes\DashEyes.exe' -ArgumentList '--diagnose', '--no-camera' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
        # Conservar el handle antes de que termine un proceso de vida corta.
        $handle = $p.Handle
        if (-not $p.WaitForExit(20000)) {
          Stop-Process -Id $p.Id -Force
          throw 'Packaged diagnosis timed out'
        }
        $p.Refresh()
        $exitCode = $p.ExitCode
        Write-Host "Packaged diagnosis exit code: [$exitCode]"
        foreach ($file in @($stdout, $stderr)) {
          Write-Host "Diagnostic file: $file"
          if (Test-Path $file) { Get-Content -Path $file }
        }
        if ($null -eq $exitCode) { throw 'PowerShell could not obtain the packaged process exit code' }
        if ($exitCode -ne 0) { throw "Packaged dispatch failed with exit code $exitCode; see diagnostic output and artifact" }
        # Exigir un informe válido: salir con 0 sin ejecutar el diagnóstico no basta.
        $report = $null
        if (Test-Path $stdout) {
          foreach ($line in Get-Content -Path $stdout) {
            try {
              $candidate = $line | ConvertFrom-Json -ErrorAction Stop
              if ($candidate.type -eq 'DIAGNOSTICS') { $report = $candidate }
            } catch { }
          }
        }
        if ($null -eq $report) { throw 'The executable returned no DIAGNOSTICS report' }
        if ($report.packages_ok -ne $true) { throw 'Packaged dependencies failed validation; see packages_details' }

    - name: Preserve diagnostics even when packaging validation fails
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: DashEyes-build-diagnostics
        if-no-files-found: warn
        include-hidden-files: true
        path: |
          ${{ runner.temp }}/dasheyes-diagnose-*.log
          ${{ runner.temp }}/dasheyes-native-libraries.log
          build/**/warn-*.txt
          dist/DashEyes/.dasheyes/logs/*.log
          dist/DashEyes/_internal/.dasheyes/logs/*.log

    - name: Upload Windows Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DashEyes-Windows-x64
        path: dist/DashEyes/
        retention-days: 14
